---
- name: Deploy ECR Image to EC2
  hosts: web
  become: true
  vars:
    aws_region: "ap-south-1"
    aws_account_id: "{{ aws_account_id }}"
    repo_name: "sample-api"
    image_tag: "latest"
    ecr_registry: "{{ aws_account_id }}.dkr.ecr.{{ aws_region }}.amazonaws.com"

  roles:
    - role: geerlingguy.docker
      docker_users:
        - ubuntu

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes

    - name: Install required system packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - unzip
        state: present

    - name: Install AWS CLI
      ansible.builtin.shell: |
        if ! command -v aws &> /dev/null; then
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          ./aws/install
          rm -rf aws awscliv2.zip
        fi
      args:
        creates: /usr/local/bin/aws

    - name: Log in to ECR
      ansible.builtin.shell: |
        aws ecr get-login-password --region {{ aws_region }} | docker login --username AWS --password-stdin {{ ecr_registry }}

    - name: Pull Docker image from ECR
      ansible.builtin.command: docker pull {{ ecr_registry }}/{{ repo_name }}:{{ image_tag }}

    - name: Stop existing container if running
      ansible.builtin.command: docker stop api-container
      failed_when: false

    - name: Remove existing container if present
      ansible.builtin.command: docker rm api-container
      failed_when: false

    - name: Run container on port 80
      ansible.builtin.command: >
        docker run -d 
        --name api-container 
        --restart unless-stopped 
        -p 80:3000 
        {{ ecr_registry }}/{{ repo_name }}:{{ image_tag }}
